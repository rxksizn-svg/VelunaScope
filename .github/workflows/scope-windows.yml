name: Build Veluna Scope for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Configure Scope Windows x64
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build Scope and tests
        run: cmake --build build --config Release --parallel 2

      - name: Run measurement checks
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package Scope
        run: python scripts/package.py

      - name: Upload Scope download
        uses: actions/upload-artifact@v7.0.2
        with:
          name: VelunaScope-Windows-x64
          path: dist/VelunaScope-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload error logs
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Scope-error-logs
          path: |
            build/CMakeFiles/CMakeConfigureLog.yaml
            build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
